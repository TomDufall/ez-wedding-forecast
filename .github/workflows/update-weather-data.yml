name: Update weather data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  update-weather-data:
    runs-on: ubuntu-latest
    env:
      WEATHER_API_KEY_SPOT: ${{ secrets.WEATHER_API_KEY_SPOT }}
      WEATHER_API_KEY_BPF: ${{ secrets.WEATHER_API_KEY_BPF }}
      WEATHER_LOCATION_BPF_COLLECTION: ${{ secrets.WEATHER_LOCATION_BPF_COLLECTION }}
      WEATHER_LOCATION_BPF_LOCATION_ID: ${{ secrets.WEATHER_LOCATION_BPF_LOCATION_ID }}
      WEATHER_LOCATION_LAT: ${{ secrets.WEATHER_LOCATION_LAT }}
      WEATHER_LOCATION_LON: ${{ secrets.WEATHER_LOCATION_LON }}

      permissions:
        contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch weather data
        run: python scripts/fetch_weather.py --out docs/

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: update weather data files"
            git push
          fi
